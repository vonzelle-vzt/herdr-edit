#
# Test pipeline for SpiceEdit. Runs `go test ./...` with the race detector
# on every push and every pull request, on Linux + macOS so we catch
# platform-specific flakes before they ship. The release workflow
# (release.yml) doesn't depend on this — it triggers separately on push
# to main — but a red test job is meant to block merges via the PR's
# required-checks setting (configure that on GitHub once the first run
# is green).

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new push lands. Saves CI
# minutes when someone pushes a quick fix on top of an in-progress run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod / go.sum are not tidy. Run 'make tidy' and commit." >&2
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # internal/lsp/live_gopls_test.go drives all eight LSP requests against a REAL gopls and
      # t.Skip()s when it is absent. That skip is the whole problem: the file exists because this
      # fork shipped "complete, tested" LSP features that no user could reach three separate times,
      # and until now gopls was installed neither here nor on any dev machine — so the one oracle
      # written to catch that class of bug had never actually executed anywhere. A skipped test is
      # indistinguishable from a passing one in the summary, which is exactly how it stayed unnoticed.
      #
      # $(go env GOPATH)/bin must go on PATH explicitly: `go install` does not put it there, and
      # exec.LookPath("gopls") failing is a SKIP, not a failure — so getting this wrong would
      # silently restore the status quo while looking green.
      - name: Install gopls (for the live LSP oracle)
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify gopls is reachable
        run: |
          command -v gopls || { echo "gopls not on PATH — the live LSP oracle would silently skip" >&2; exit 1; }

      # internal/dap/live_dlv_test.go is the same shape of oracle for the debug
      # adapter: it drives a REAL delve through a real session — launch, bind a
      # breakpoint, stop on it, read the stack — and t.Skip()s when dlv is
      # absent. Every trap in that package (correlating on request_seq, the
      # initialized event arriving before the initialize response, blocking on
      # the launch response) fails as a HANG or a silently wrong answer, which
      # is precisely the class of bug only a live adapter catches.
      #
      # HERDR_REQUIRE_DAP=1 below is the anti-skip gate: it turns every skip in
      # that file into a failure, so the oracle going quiet turns CI red instead
      # of leaving a skipped test that reads as a pass in the summary.
      - name: Install delve (for the live DAP oracle)
        run: |
          go install github.com/go-delve/delve/cmd/dlv@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Known upstream skew: delve refuses to run against a Go toolchain it does not
      # recognise yet (its --check-go-version guard), and this job uses go-version:
      # stable. When Go ships a release before delve supports it, the live oracle
      # fails here rather than in the DAP client. That guard is deliberately NOT
      # disabled — a user on that toolchain genuinely cannot debug, and turning off
      # a safety check to keep a badge green hides a real limitation — so `dlv
      # version` runs first to name the cause instead of leaving it to look like a
      # bug in internal/dap.
      - name: Verify dlv is reachable
        run: |
          command -v dlv || { echo "dlv not on PATH — the live DAP oracle would silently skip" >&2; exit 1; }
          dlv version || { echo "delve will not run against this Go toolchain — an upstream skew, not a fault in internal/dap" >&2; exit 1; }

      # The SECOND adapter. internal/dap/live_debugpy_test.go and the app-level end-to-end oracle
      # both drive a real debugpy, and HERDR_REQUIRE_DAP=1 below turns their skip into a failure —
      # which is exactly what it is for, and exactly what caught this: v0.15.0 went red on main
      # because CI installed gopls and dlv but never debugpy, so four oracles that pass locally
      # could not run here. The gate was right; the environment was incomplete. Installing the
      # dependency is the fix; relaxing the gate would have restored a green badge over four
      # oracles that never execute, which is the state this whole anti-skip mechanism exists to
      # prevent.
      - name: Install debugpy (for the live DAP oracle)
        run: |
          python3 -m pip install --user debugpy \
            || python3 -m pip install debugpy \
            || python3 -m pip install --break-system-packages debugpy

      - name: Verify debugpy is reachable
        run: |
          python3 -c "import debugpy; print('debugpy', debugpy.__version__)" \
            || { echo "debugpy is not importable — the live debugpy oracles would fail under HERDR_REQUIRE_DAP=1" >&2; exit 1; }

      - name: Test
        env:
          # Fail rather than skip if either live oracle cannot run. Both binaries
          # are installed above, so a skip here means the install broke.
          HERDR_REQUIRE_DAP: "1"
        run: go test -race -coverprofile=coverage.out ./...

      # Print a coverage summary into the run log so reviewers can see
      # the trend at a glance without downloading the artifact.
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 30

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
